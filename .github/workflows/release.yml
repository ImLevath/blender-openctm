name: Release Blender plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("src/blender_manifest.toml").read_text(encoding="utf-8"))
          print(data["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release_meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="pre-v${{ steps.version.outputs.version }}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=OpenCTM Blender v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: |
          mkdir -p dist
          cp -R src "dist/openctm_ctm"
          (
            cd dist
            zip -r "openctm_ctm-addon-blender3.6-v${{ steps.version.outputs.version }}.zip" openctm_ctm
          )
          (
            cd src
            zip -r "../dist/openctm_ctm-extension-blender4.2-v${{ steps.version.outputs.version }}.zip" .
          )

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: true
          files: |
            dist/openctm_ctm-addon-blender3.6-v${{ steps.version.outputs.version }}.zip
            dist/openctm_ctm-extension-blender4.2-v${{ steps.version.outputs.version }}.zip
